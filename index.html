<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles.css" />
    <title>WeatherApp2026</title>
</head>
<body>
    <div class="main-box">
    <header>
        <form class="search-form">
            <input type="Search" placeholder="Enter city..." required class="search-form-input" />
            <input type="Submit" value="Search" class="search-form-button"/>
        </form>
    </header>
    <main>
    <div class="weather-data">
        <div>
            <h1 class="weather-city">Indianapolis</h1>
            <p class="weather-details">
                Thursday May 28 9:55pm
                <br />
                H: <strong>81°</strong> L: <strong>60°</strong>
            </p>
    </div>
    <div class="weather-temp-container">
        <div class="weather-icon">☁️</div>
        <div class="weather-temp">69</div>
        <div class="weather-fahrenheit">°F</div>
    </div>
    </main>
    <footer>
        Coded by 
        <a href="https://github.com/briawilliamson" target="_blank"> Bria Williamson</a>, code hosted on
        <a href="https://github.com/briawilliamson/WeatherApp2026" target="_blank"> GitHub</a> and website hosted on
        <a href="https://myweather2026.netlify.app" target="_blank">Netlify</a>
    </footer>
    </div>
</body>
</html>

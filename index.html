<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <title>WeatherApp2026</title>
</head>
<body>
    <div class="main-box">
    <header>
        <form class="search-form" id="search-form">
            <input type="Search" placeholder="Enter city..." required id="search-form-input" class="search-form-input" />
            <input type="Submit" value="Search" class="search-form-button"/>
        </form>
    </header>
    <main>
    <div class="weather-data">
        <div>
            <h1 class="weather-city" id="city"></h1>
            <p class="weather-details">
               <span id="time"></span>, 
               <span id="description"></span>
                <br />
                Huminity: <strong id="humidity"></strong>, 
                Wind Speed: <strong id="wind-speed"></strong>
            </p>
        </div>
     <div class="weather-temperture-container">
        <div class="weather-icon"></div>
        <div class="weather-temperture" id="temperture"></div>
        <div class="weather-fahrenheit" id="fahrenheit"></div>
     </div>
    </div>
    </main>
    <footer>
        Coded by 
        <a href="https://github.com/briawilliamson" target="_blank"> Bria Williamson</a>, code hosted on
        <a href="https://github.com/briawilliamson/WeatherApp2026" target="_blank"> GitHub</a> and website hosted on
        <a href="https://myweather2026.netlify.app" target="_blank">Netlify</a>
    </footer>
    </div>
    <script src="src/index.js"></script>
</body>
</html>
